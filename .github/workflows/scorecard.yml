name: OpenSSF Scorecard

on:
  push:
    branches: [main]
  schedule:
    - cron: "23 5 * * 2"

permissions: read-all

jobs:
  analysis:
    runs-on: ubuntu-latest
    # A job-level permissions block replaces the top-level one completely, so
    # every permission this job needs has to be listed here.
    permissions:
      # Publishing the results.
      security-events: write
      id-token: write
      # Reads Scorecard needs for its GraphQL queries and SAST detection.
      # Without issues, pull-requests and checks it fails with
      # "Resource not accessible by integration" during ListCommits.
      contents: read
      issues: read
      pull-requests: read
      checks: read
      # Lets Scorecard and upload-sarif read this repository's workflow runs.
      actions: read
    steps:
      - uses: actions/checkout@v4.4.0
        with:
          persist-credentials: false

      # Scorecard analyses public repositories, and uploading its results uses
      # code scanning, which needs a public repository or GitHub Advanced
      # Security. Skip it with a notice while the repository is private; it runs
      # automatically once the repository is public.
      - name: Check whether the repository is public
        id: scanning
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          visibility="$(gh api "repos/${GITHUB_REPOSITORY}" --jq .visibility 2>/dev/null || echo unknown)"
          if [ "$visibility" = "public" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Scorecard skipped::OpenSSF Scorecard reports on public repositories. This repository is ${visibility}, so the analysis was skipped. It runs automatically once the repository is public."
          fi

      # ossf/scorecard-action publishes no floating major tag such as "v2",
      # only full versions, so this reference must name one.
      - uses: ossf/scorecard-action@v2.5.0
        if: steps.scanning.outputs.available == 'true'
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - uses: github/codeql-action/upload-sarif@v3.39.1
        if: steps.scanning.outputs.available == 'true'
        with:
          sarif_file: results.sarif