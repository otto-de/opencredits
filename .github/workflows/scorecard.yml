name: OpenSSF Scorecard

on:
  push:
    branches: [main]
  schedule:
    - cron: "23 5 * * 2"
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    runs-on: ubuntu-latest
    # A job-level permissions block replaces the top-level one completely, so
    # every permission this job needs has to be listed here.
    permissions:
      # publish_results needs id-token: write, which is what makes the badge
      # work. security-events: write uploads the SARIF to code scanning.
      security-events: write
      id-token: write
      # Reads Scorecard needs for its GraphQL queries and SAST detection.
      # Without issues, pull-requests and checks it fails with
      # "Resource not accessible by integration" during ListCommits.
      contents: read
      issues: read
      pull-requests: read
      checks: read
      # Lets Scorecard and upload-sarif read this repository's workflow runs.
      actions: read
    steps:
      - uses: actions/checkout@v4.4.0
        with:
          persist-credentials: false

      # ossf/scorecard-action publishes no floating major tag such as "v2",
      # only full versions, so this reference must name one.
      - uses: ossf/scorecard-action@v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          # Required for the README badge. Only works on a public repository.
          publish_results: true

      # Keeps the run green if code scanning is not enabled yet. Publishing the
      # score already happened in the step above, so the badge does not depend
      # on this upload succeeding.
      - uses: github/codeql-action/upload-sarif@v4.39.3
        continue-on-error: true
        with:
          sarif_file: results.sarif