name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      # security-events: write uploads the results.
      # actions: read lets the analyze step read this workflow run through the
      # API. Without it the analysis finishes but the step then fails with
      # "Resource not accessible by integration".
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4.4.0
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@v4.39.1
        with:
          languages: javascript-typescript
          queries: security-extended
      - uses: github/codeql-action/analyze@v4.39.1